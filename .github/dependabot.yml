version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Flask and Werkzeug must be upgraded together
      flask-stack:
        patterns:
          - "flask*"
          - "Flask*"
          - "werkzeug"
          - "Werkzeug"
          - "jinja2"
          - "Jinja2"
          - "itsdangerous"
          - "markupsafe"
          - "MarkupSafe"
          - "blinker"
          - "click"
      # Remaining minor/patch updates in a single PR
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(docker)"
