version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # All security fixes in a single PR
      security:
        applies-to: security-updates
        patterns:
          - "*"
      # Flask and Werkzeug must be upgraded together
      flask-stack:
        patterns:
          - "flask*"
          - "Flask*"
          - "werkzeug"
          - "Werkzeug"
          - "jinja2"
          - "Jinja2"
          - "itsdangerous"
          - "markupsafe"
          - "MarkupSafe"
          - "blinker"
          - "click"
      # Remaining minor/patch updates in a single PR
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # Major updates may contain breaking changes, review them together
      major:
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(docker)"
